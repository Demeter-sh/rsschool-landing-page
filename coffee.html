<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee</title>
    <link rel="stylesheet" href="CSS/Topography-colors.css">
    <link rel="stylesheet" href="CSS/coffee.css">
</head>
<body>
    <div class="inter-font background-page">
        <header>
            <article>
                <div class="header-menu">
                    <div><img src="img/logo.svg" alt="logo-day"></div>
                    <nav class="link-and-button text-primary">
                        <ul>
                            <li><a href="">Favorite coffee</a></li>
                            <li><a href="">About</a></li>
                            <li><a href="">Mobile app</a></li>
                            <li><a href="">Contact us</a></li>
                        </ul>
                    </nav>
                    <div>
                        <button class="background-page">
                            <img src="img/Theme switch.png" alt="Theme-switch">
                        </button>
                        <button class="background-page link-and-button text-primary">Menu <img src="img/coffee-cup.svg" alt="coffee-cup"></button>
                    </div>
                </div>
            </article>
            <article>
                <h1 class="heading-1">Behind each of our cups<br> hides an <span class="heading-1-accent text-accent">amazing surprise</span></h1>
                <div>
                    <button class="link-and-button background-page text-primary"><span class="png-background"></span> Coffee</button>
                    <button class="link-and-button background-page text-primary"><span class="png-background"></span> Tea</button>
                    <button class="link-and-button background-page text-primary"><span class="png-background"></span> Desert</button>
                </div>
            </article>
        </header>
        <main></main>
        <footer>
            <article class="background-container">
                <div>
                    <h2 class="heading-2 text-inverse">Sip, Savor, Smile.<br><span class="text-accent heading-2-accent">It’s coffee time!</span></h2>
                    <div>
                        <a href="" class="x-social"></a>
                        <a href="" class="insta"></a>
                        <a href="" class="facebook"></a>
                    </div>
                </div>
                <div>
                    <h3 class="heading-3  text-inverse">Contact us</h3>
                    <nav class="text-inverse">
                        <ul>
                            <li><a href=""><img src="img/Ellipse.png" alt="Ellipse" style="color: red;"><span>8558 Green Rd.,  LA</span></a></li>
                            <li><a href=""><img src="img/Path.png" alt="path"><span>1 (603) 555-0123</span>+</a></li>
                            <li><a href=""><img src="img/clock.png" alt="clock"><span>Mon–Sat: 9:00–23:00</span></a></li>
                        </ul>
                    </nav>
                </div>
            </article>
        </footer>
    </div>
